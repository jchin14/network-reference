name: CI

# Runs on push/PR to the public repo (free minutes), and on dev only when scripts/release.sh or
# `gh workflow run ci.yml` starts it.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript syntax
        run: |
          node -e '
            const s=require("fs").readFileSync("index.html","utf8");
            const js=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).join("\n;\n");
            if(!js) throw new Error("no inline script found");
            require("fs").writeFileSync("/tmp/page.js",js)'
          node --check /tmp/page.js
      - name: Every tab has a panel
        run: |
          for t in $(grep -o 'data-tab="[a-z0-9]*"' index.html | cut -d'"' -f2); do
            grep -q "id=\"tab-$t\"" index.html || { echo "missing panel tab-$t"; exit 1; }
          done
      - name: Logo and license present
        run: test -s logo.svg && test -s LICENSE
